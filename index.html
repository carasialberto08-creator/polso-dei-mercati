// Simula il PAC mese per mese: restituisce valore e versato a fine di ogni anno
function pacSim(init, month, years, rate) {
  const r = Math.pow(1 + rate / 100, 1 / 12) - 1; let v = init, paid = init; const pts = [{ y: 0, v, paid }];
  for (let mth = 1; mth <= years * 12; mth++) { v = v * (1 + r) + month; paid += month; if (mth % 12 === 0) pts.push({ y: mth / 12, v, paid }); }
  return pts;
}
function calcUpdate() {
  const g = k => Math.max(0, parseFloat($("#c-" + k).value) || 0);
  const init = g("init"), month = g("month"), years = Math.min(50, Math.max(1, Math.round(g("years")) || 1)), rate = parseFloat($("#c-rate").value) || 0;
  Store.set("calc", { init, month, years, rate });
  const pts = pacSim(init, month, years, rate), last = pts[pts.length - 1];
  const gain = last.v - last.paid, tax = Math.max(0, gain) * 0.26;
  $("#c-out").innerHTML = `<div class="stats"><div class="stat"><span>Versato</span><b>${eur(last.paid)}</b></div><div class="stat"><span>Valore finale</span><b>${eur(last.v)}</b></div><div class="stat"><span>Guadagno lordo</span><b class="${cls(gain)}">${eur(gain)}</b></div><div class="stat"><span>Netto dopo il 26%</span><b>${eur(last.v - tax)}</b></div></div>`;
  if (!window.Chart) return;
  destroyChart("calc");
  const fg = cssVar("--muted");
  charts.calc = new Chart($("#calc-chart"), { type: "line",
    data: { labels: pts.map(p => "Anno " + p.y), datasets: [
      { label: "Valore", data: pts.map(p => Math.round(p.v)), borderColor: cssVar("--accent"), backgroundColor: cssVar("--accent-soft"), fill: true, pointRadius: 0, borderWidth: 2 },
      { label: "Versato", data: pts.map(p => Math.round(p.paid)), borderColor: cssVar("--muted"), borderDash: [4, 3], pointRadius: 0, borderWidth: 1.5 }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: fg, boxWidth: 14 } } },
      scales: { x: { ticks: { color: fg, maxTicksLimit: 6 }, grid: { display: false } }, y: { ticks: { color: fg, callback: v => v.toLocaleString("it-IT") + " €" }, grid: { color: cssVar("--line") } } } } });
}
function renderGlossario() {
  $("#acad-body").innerHTML = `<div class="card">${Object.values(GL).map(g => `<details class="gl"><summary>${esc(g[0])}</summary><p>${esc(g[1])}</p><p class="muted"><strong>Esempio.</strong> ${esc(g[2])}</p></details>`).join("")}</div>`;
}

/* =========================================================
   18. SIMULATORE
   ========================================================= */
const SIM0 = () => ({ cash: 10000, pos: {}, trades: [], benchStart: null, snaps: [] });
let sim = Store.get("sim", SIM0());
let simConfirm = false, simPreset = null;
function saveSim() { Store.set("sim", sim); }
// Prezzo in euro di un titolo per il simulatore
async function simPrice(stock) {
  await ensureFX();
  const pd = await quickPrice(stock);
  return { price: toEUR(pd.price, pd.ccy), source: pd.source, ccy: pd.ccy };
}
async function benchPrice() {
  await ensureFX();
  if (BD.on) { try { const v = await bdEtfPrice(VT_ID); if (isNum(v)) return { price: toEUR(v, "USD"), source: "bigdata" }; } catch (e) {} }
  const pd = await getPriceData(BENCH, false);
  return { price: pd.price, source: pd.source };
}
async function simValues() {
  const syms = Object.keys(sim.pos);
  const prices = {};
  await Promise.all(syms.map(async s => { prices[s] = (await simPrice(bySym(s))).price; }));
  const bench = await benchPrice();
  const invested = syms.reduce((t, s) => t + sim.pos[s].qty * prices[s], 0);
  const total = sim.cash + invested;
  const benchVal = sim.benchStart ? 10000 * bench.price / sim.benchStart : 10000;
  return { prices, invested, total, benchVal, benchPrice: bench.price, benchSrc: bench.source };
}
async function renderSimulatore() {
  const el = $("#view-simulatore");
  el.innerHTML = '<p class="skeleton">Calcolo il valore del portafoglio…</p>';
  const v = await simValues();
  const today = iso(new Date());
  if (sim.trades.length) {
    sim.snaps = sim.snaps.filter(s => s.d !== today); sim.snaps.push({ d: today, v: Math.round(v.total), b: Math.round(v.benchVal) });
    sim.snaps = sim.snaps.slice(-365); saveSim();
  }
  const ret = (v.total / 10000 - 1) * 100, bret = (v.benchVal / 10000 - 1) * 100;
  const pre = simPreset || (sim.trades[0] && sim.trades[0].sym) || "KO";
  el.innerHTML = `<div class="section-h"><h2>Simulatore</h2>${help("sim")}</div>
    <div class="stats">
      <div class="stat"><span>Valore portafoglio</span><b>${eur(v.total)}</b></div>
      <div class="stat"><span>Rendimento</span><b class="${cls(ret)}">${pct(ret)}</b></div>
      <div class="stat"><span>Liquidità</span><b>${eur(sim.cash)}</b></div>
      <div class="stat"><span>ETF globale, stessi 10.000 €</span><b class="${cls(bret)}">${pct(bret)}</b></div>
    </div>
    ${sim.trades.length ? `<p class="small">${ret >= bret ? `Per ora le tue scelte fanno meglio dell'ETF globale di ${nf(ret - bret, 2)} punti.` : `Per ora l'ETF globale fa meglio delle tue scelte di ${nf(bret - ret, 2)} punti. Succede spesso: è la ragione per cui molti investitori partono da un ETF.`}</p>` : ""}
    ${sim.snaps.length > 1 && window.Chart ? '<div class="card"><div class="chart-box"><canvas id="sim-chart" aria-label="Andamento portafoglio contro ETF globale"></canvas></div></div>' : ""}
    <div class="card" style="display:grid;gap:12px"><h3>Nuova operazione</h3>
      <div class="filters">
        <label class="fld" for="sim-sym">Titolo<select id="sim-sym">${UNIVERSE.map(s => opt(s.sym, s.name, pre)).join("")}</select></label>
        <label class="fld" for="sim-qty">Quantità<input type="number" id="sim-qty" min="1" step="1" value="5"></label>
      </div>
      <p id="sim-price" class="small muted">Prezzo: carico…</p>
      <div class="btn-row"><button class="btn" data-act="sim-buy">Compra</button><button class="btn ghost" data-act="sim-sell">Vendi</button></div>
      <p id="sim-msg" class="small" hidden></p></div>
    <div class="card"><h3>Posizioni</h3>${Object.keys(sim.pos).length ? `<div class="tbl-wrap"><table><thead><tr><th>Titolo</th><th class="n">Qtà</th><th class="n">Prezzo medio</th><th class="n">Attuale</th><th class="n">Risultato</th></tr></thead><tbody>
      ${Object.entries(sim.pos).map(([s, p]) => { const pr = v.prices[s]; const r = (pr / p.avg - 1) * 100; return `<tr><td>${esc(bySym(s).name)}</td><td class="n">${p.qty}</td><td class="n">${nf(p.avg)}</td><td class="n">${nf(pr)}</td><td class="n ${cls(r)}">${pct(r)}</td></tr>`; }).join("")}
      </tbody></table></div>` : '<p class="small muted" style="margin-top:6px">Nessuna posizione. Scegli un titolo e compra qualche azione finta per iniziare.</p>'}</div>
    <div class="card"><h3>Storico operazioni</h3>${sim.trades.length ? `<div class="tbl-wrap"><table><thead><tr><th>Data</th><th>Operazione</th><th class="n">Qtà</th><th class="n">Prezzo</th></tr></thead><tbody>
      ${sim.trades.slice().reverse().map(t => `<tr><td>${fmtDay(t.d)}</td><td>${t.side === "buy" ? "Acquisto" : "Vendita"} ${esc(bySym(t.sym).name)}</td><td class="n">${t.qty}</td><td class="n">${nf(t.price)}</td></tr>`).join("")}
      </tbody></table></div>` : '<p class="small muted" style="margin-top:6px">Ancora nessuna operazione.</p>'}</div>
    <div id="sim-reset-box">${simConfirm ? '<div class="card" style="display:grid;gap:10px"><p>Ricominciare da 10.000 €? Posizioni e storico verranno cancellati.</p><div class="btn-row"><button class="btn danger" data-act="sim-reset-yes">Sì, ricomincia</button><button class="btn ghost" data-act="sim-reset-no">Annulla</button></div></div>' : '<button class="btn ghost small" data-act="sim-reset">Ricomincia da capo</button>'}</div>`;
  $("#sim-sym").addEventListener("change", simShowPrice);
  simShowPrice();
  drawSimChart();
}
async function simShowPrice() {
  const s = bySym($("#sim-sym").value); const pd = await simPrice(s);
  const conv = BD.on && pd.ccy && pd.ccy !== "EUR" ? ` (convertito da ${esc(pd.ccy)})` : "";
  const el = $("#sim-price"); if (el) el.innerHTML = `Prezzo: <span class="num">${BD.on ? eur(pd.price) : nf(pd.price)}</span>${conv} ${srcBadge(pd.source)}${sim.pos[s.sym] ? ` · ne hai ${sim.pos[s.sym].qty}` : ""}`;
}
function drawSimChart() {
  const cv = $("#sim-chart"); if (!cv || !window.Chart) return;
  destroyChart("sim"); const fg = cssVar("--muted");
  charts.sim = new Chart(cv, { type: "line",
    data: { labels: sim.snaps.map(s => fmtDay(s.d)), datasets: [
      { label: "Il tuo portafoglio", data: sim.snaps.map(s => s.v), borderColor: cssVar("--accent"), pointRadius: 2, borderWidth: 2 },
      { label: "ETF globale", data: sim.snaps.map(s => s.b), borderColor: cssVar("--muted"), borderDash: [4, 3], pointRadius: 0, borderWidth: 1.5 }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: fg, boxWidth: 14 } } },
      scales: { x: { ticks: { color: fg, maxTicksLimit: 6 }, grid: { display: false } }, y: { ticks: { color: fg }, grid: { color: cssVar("--line") } } } } });
}
async function simTrade(side) {
  const s = bySym($("#sim-sym").value); const qty = Math.floor(parseFloat($("#sim-qty").value));
  const msg = $("#sim-msg"); msg.hidden = false;
  if (!(qty > 0)) { msg.textContent = "Inserisci una quantità intera maggiore di zero."; return; }
  const pd = await simPrice(s); const cost = qty * pd.price;
  if (!isNum(cost)) { msg.textContent = "Prezzo non disponibile in questo momento: riprova tra poco."; return; }
  if (side === "buy") {
    if (cost > sim.cash) { msg.textContent = `Liquidità insufficiente: servono ${eur(cost)}, hai ${eur(sim.cash)}.`; return; }
    if (!sim.benchStart) sim.benchStart = (await benchPrice()).price;
    const p = sim.pos[s.sym] || { qty: 0, avg: 0 };
    p.avg = (p.avg * p.qty + cost) / (p.qty + qty); p.qty += qty; sim.pos[s.sym] = p; sim.cash -= cost;
  } else {
    const p = sim.pos[s.sym];
    if (!p || p.qty < qty) { msg.textContent = `Non hai abbastanza azioni di ${s.name} da vendere.`; return; }
    p.qty -= qty; sim.cash += cost; if (p.qty === 0) delete sim.pos[s.sym];
  }
  sim.trades.push({ d: iso(new Date()), sym: s.sym, side, qty, price: pd.price });
  simPreset = s.sym; saveSim();
  await renderSimulatore();
  const m2 = $("#sim-msg"); m2.hidden = false;
  m2.textContent = `${side === "buy" ? "Acquistate" : "Vendute"} ${qty} azioni ${s.name} a ${nf(pd.price)}.`;
}

/* =========================================================
   19. IMPOSTAZIONI
   ========================================================= */
function openSettings() {
  openSheet("Impostazioni", `<form id="set-form" class="sheet-body">
    <div class="card" style="display:grid;gap:8px"><div class="section-h"><h3>Fonte dei dati</h3>${BD.on ? srcBadge("bigdata") : ""}</div>
      <p class="small">${BD.on ? "L'app usa i tuoi connettori: Zacks per i titoli quotati negli USA (prezzi, fondamentali, analisti, trimestrali e notizie, in memoria 6 ore), Bigdata.com per l'S&P 500, il VIX, i prezzi quasi in tempo reale e i titoli quotati solo in Europa (al massimo una chiamata ogni 15 minuti per i movimenti, il resto in memoria fino a 6 ore), Alpha Vantage per lo storico giornaliero (in memoria 12 ore). Twelve Data aggiorna da solo i prezzi in tempo reale dei titoli USA, compreso pre-market e after-hours: il titolo che guardi ogni minuto, watchlist e S&P 500 ogni 5 minuti, nessun aggiornamento a mercato USA chiuso. Richieste Twelve Data usate oggi: " + tdUsage().n + " su 800." + (BD.issue ? " " + (BD_FIX[BD.issue] || "") : "") + (ZK.issue ? " Zacks: accesso non disponibile, controlla il connettore su claude.ai." : "") + (AV.issue ? " " + AV_FIX[AV.issue] : "")
        : BD.issue ? esc(BD_FIX[BD.issue] || "Bigdata.com non è disponibile in questa vista.")
        : "Bigdata.com funziona quando apri l'app dentro Claude. Qui servono le chiavi API qui sotto, altrimenti vedi dati demo."}</p></div>
    <div class="card" style="display:grid;gap:12px"><h3>Chiavi API ${BD.on ? '<span class="small muted" style="font-weight:400">· di riserva</span>' : ""}</h3>
      <label class="fld" for="s-fh">Finnhub (prezzi, notizie, fondamentali, trimestrali)<input type="password" id="s-fh" autocomplete="off" value="${esc(S.finnhubKey)}" placeholder="incolla qui la chiave"></label>
      <label class="fld" for="s-prov">Storico prezzi (grafici, medie mobili, RSI)<select id="s-prov">${opt("fmp", "Financial Modeling Prep (consigliato, 250 chiamate/giorno)", S.histProvider)}${opt("av", "Alpha Vantage (25 chiamate/giorno, 100 giorni di storico)", S.histProvider)}</select></label>
      <label class="fld" for="s-hk">Chiave per lo storico<input type="password" id="s-hk" autocomplete="off" value="${esc(S.histKey)}" placeholder="incolla qui la chiave"></label>
      <label class="small" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="s-show"> Mostra le chiavi</label>
      <p class="small muted">Le chiavi restano salvate solo in questo browser.</p></div>
    <div class="card" style="display:grid;gap:12px"><h3>Tassi inseriti a mano</h3>
      <label class="fld" for="s-btp">Rendimento BTP 10 anni (%)<input type="number" step="0.01" id="s-btp" value="${esc(S.btp)}" placeholder="es. 3,45"></label>
      <label class="fld" for="s-ust">Treasury USA 10 anni (%), facoltativo<input type="number" step="0.01" id="s-ust" value="${esc(S.treasury)}" placeholder="lascia vuoto per il dato automatico"></label></div>
    <div class="card" style="display:grid;gap:12px"><div class="section-h"><h3>Il tuo profilo</h3>${help("profilo")}</div>
      <label class="fld" for="s-prof">Profilo di rischio<select id="s-prof">${Object.entries(PROFILES).map(([k, p]) => opt(k, p.label, S.profile)).join("")}</select></label>
      <label class="fld" for="s-hor">Orizzonte temporale<select id="s-hor">${Object.entries(HORIZONS).map(([k, h]) => opt(k, h.label, S.horizon)).join("")}</select></label></div>
    <div class="card" style="display:grid;gap:12px"><h3>Aspetto</h3>
      <label class="fld" for="s-theme">Tema<select id="s-theme">${opt("system", "Come il sistema", S.theme)}${opt("light", "Chiaro", S.theme)}${opt("dark", "Scuro", S.theme)}</select></label></div>
    <div class="btn-row"><button class="btn" type="submit">Salva</button><button class="btn ghost" type="button" data-act="clear-cache">Svuota la cache dei dati</button></div>
    <p id="set-msg" class="small" hidden></p></form>`);
  $("#s-show").addEventListener("change", e => { ["#s-fh", "#s-hk"].forEach(id => { $(id).type = e.target.checked ? "text" : "password"; }); });
  $("#set-form").addEventListener("submit", e => {
    e.preventDefault();
    const prevKeys = S.finnhubKey + S.histKey + S.histProvider;
    S = Object.assign(S, {
      finnhubKey: $("#s-fh").value.trim(), histProvider: $("#s-prov").value, histKey: $("#s-hk").value.trim(),
      btp: $("#s-btp").value.trim().replace(",", "."), treasury: $("#s-ust").value.trim().replace(",", "."),
      profile: $("#s-prof").value, horizon: $("#s-hor").value, theme: $("#s-theme").value
    });
    const ok = Store.set("settings", S);
    applyTheme(); updateDemoBanner();
    if (prevKeys !== S.finnhubKey + S.histKey + S.histProvider) { Errors.clear(); ErrGroups.clear(); renderErrors(); }
    VIEWS.forEach(v => { rendered[v] = false; });
    const m = $("#set-msg"); m.hidden = false;
    m.textContent = ok ? "Impostazioni salvate. I dati si aggiornano." : "Impostazioni applicate, ma il browser non permette di salvarle: andranno reinserite alla prossima apertura.";
    showView(current);
  });
}
function applyTheme() {
  if (S.theme === "system") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", S.theme);
}
function updateDemoBanner() {
  const b = $("#demo-banner");
  if (BD.on) { b.hidden = true; return; }
  const missing = [];
  if (!S.finnhubKey) missing.push("Finnhub");
  if (!S.histKey) missing.push("storico prezzi");
  if (!missing.length) { b.hidden = true; return; }
  b.hidden = false;
  b.innerHTML = `<span>${missing.length === 2 ? "Stai vedendo dati <strong>demo</strong>, non reali." : "Manca la chiave " + missing[0] + ": quella parte usa dati <strong>demo</strong>."} Inserisci le chiavi gratuite per i dati veri.</span><button class="btn small" data-act="settings">Inserisci le chiavi</button>`;
}

/* =========================================================
   20. EVENTI E AVVIO
   ========================================================= */
const RENDER = { mercato: renderMercato, azioni: renderAzioni, watchlist: renderWatchlist, accademia: renderAccademia, simulatore: renderSimulatore };
document.addEventListener("click", e => {
  const h = e.target.closest("[data-help]"); if (h) { e.preventDefault(); openHelp(h.dataset.help); return; }
  const tab = e.target.closest(".tab"); if (tab) { go(tab.dataset.view); return; }
  if (e.target === $("#sheet")) { closeSheet(); return; }
  if (e.target === $("#help")) { $("#help").hidden = true; return; }
  const a = e.target.closest("[data-act]"); if (!a) return;
  const sym = a.dataset.sym;
  switch (a.dataset.act) {
    case "settings": openSettings(); break;
    case "refresh": refreshAll(); break;
    case "bd-retry": BD.issue = null; BD.on = !!BD.mcp; renderBdBanner(); refreshAll(); break;
    case "bd-allow": allowBD(); break;
    case "av-allow": allowAV(); break;
    case "moves-seen": { const day = iso(new Date()); const seen = Store.get("moves_seen", {}); MOVERS.list.filter(bigMove).forEach(r => { seen[r.s.sym + day] = Math.round((r.ahPct ?? r.d1) || 0); }); Store.set("moves_seen", seen); renderMoveBanner(); break; }
    case "chart-range": chartRange = +a.dataset.n; document.querySelectorAll('[data-act="chart-range"]').forEach(x => x.setAttribute("aria-pressed", String(+x.dataset.n === chartRange))); if (lastBundle) drawStockChart(lastBundle); break;
    case "close-sheet": closeSheet(); break;
    case "close-help": $("#help").hidden = true; break;
    case "err-close": Errors.clear(); ErrGroups.clear(); renderErrors(); break;
    case "open-stock": openStock(sym); break;
    case "toggle-watch": toggleWatch(sym); rendered.watchlist = false; break;
    case "check-ah": checkAfterHours(); break;
    case "explain": { const box = $("#explain-box"); if (lastBundle && lastBundle.stock.sym === sym && box) { box.innerHTML = explainHTML(lastBundle); box.scrollIntoView({ behavior: "smooth", block: "start" }); } break; }
    case "explain-acad": explainAcad(); break;
    case "sim-preset": simPreset = sym; closeSheet(); rendered.simulatore = true; go("simulatore"); break;
    case "seen-alert": delete alerts[sym]; Store.set("alerts", alerts); updateWatchDot(); renderWatchlist(); break;
    case "seen-all": alerts = {}; Store.set("alerts", alerts); updateWatchDot(); renderWatchlist(); break;
    case "goto": go(a.dataset.view); break;
    case "acad-tab": acadTab = a.dataset.tab; renderAccademia(); break;
    case "open-lesson": openLesson(a.dataset.id); break;
    case "sim-buy": simTrade("buy"); break;
    case "sim-sell": simTrade("sell"); break;
    case "sim-reset": simConfirm = true; renderSimulatore(); break;
    case "sim-reset-no": simConfirm = false; renderSimulatore(); break;
    case "sim-reset-yes": simConfirm = false; sim = SIM0(); saveSim(); renderSimulatore(); break;
    case "clear-cache": Store.clear([""]); demoCache.clear(); { const m = $("#set-msg"); if (m) { m.hidden = false; m.textContent = "Cache svuotata: i prossimi dati verranno richiesti di nuovo alle API."; } } break;
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape") { if (!$("#help").hidden) $("#help").hidden = true; else if (!$("#sheet").hidden) closeSheet(); } });
window.addEventListener("hashchange", () => showView(location.hash.slice(1)));
// Ridisegna i grafici quando cambia il tema del sistema
try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (lastBundle && !$("#sheet").hidden) drawStockChart(lastBundle); if (current === "simulatore") drawSimChart(); }); } catch (e) {}

// Aggiorna tutti i dati: svuota le cache e ridisegna la sezione aperta
async function refreshAll() {
  Store.clear(["q_", "news", "cn_"]); Errors.clear(); ErrGroups.clear(); renderErrors();
  if (BD.mcp) { try { await BD.mcp.invalidate(BD_SERVER); } catch (e) {} }
  VIEWS.forEach(v => { rendered[v] = false; });
  updateDemoBanner(); showView(current);
}
// Chiede il consenso per Bigdata.com e riprova
async function allowBD() {
  try { const perm = await window.claude.use("permissions"); if (perm) await perm.request(["mcp:" + BD_SERVER]); } catch (e) {}
  BD.issue = null; BD.on = !!BD.mcp; renderBdBanner(); refreshAll();
}

// Chiede il consenso per Alpha Vantage e riapre la scheda
async function allowAV() {
  try { const perm = await window.claude.use("permissions"); if (perm) await perm.request(["mcp:" + AV_SERVER]); } catch (e) {}
  AV.issue = null; AV.on = !!BD.mcp;
  if (lastBundle) openStock(lastBundle.stock.sym);
}

// Avvio: prima prova a collegare Bigdata.com, poi disegna la sezione richiesta
(async function boot() {
  applyTheme();
  updateWatchDot();
  if (window.claude && typeof window.claude.use === "function") {
    $("#view-mercato").hidden = false;
    $("#view-mercato").innerHTML = '<div class="card"><p class="skeleton">Collego le fonti dati e la tua watchlist…</p></div>';
    await Promise.all([initBD(), initWatchSync()]);
  }
  updateDemoBanner();
  renderBdBanner();
  showView(location.hash.slice(1) || "mercato");
  // Aggiornamento leggero ogni 15 minuti, solo se il cruscotto è in primo piano (per non consumare crediti):
  // i movimenti ogni volta, l'S&P 500 una volta all'ora.
  // Prezzi in tempo reale: il pianificatore Twelve Data controlla ogni 15 secondi cosa aggiornare
  if (TD.on) { renderLiveChip(); tdTick(); setInterval(tdTick, 15000); document.addEventListener("visibilitychange", () => { if (!document.hidden) tdTick(); }); }
  let tick = 0;
  setInterval(async () => {
    if (document.hidden || current !== "mercato" || !$("#sheet").hidden) return;
    tick++;
    if (tick % 4 === 0) { renderMercato(); return; }
    await getMovers();
    renderMovers();
  }, 15 * MIN);
})();
