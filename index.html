<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Polso dei Mercati – Coach: cruscotto di mercato, screener di azioni e accademia per l'investitore privato italiano. Strumento educativo, non consulenza finanziaria.">
<title>Polso dei Mercati – Coach</title>
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: app mobile-first a colonna singola, header fisso in alto, barra di navigazione in basso; i dati sono "strumenti" su fondo grigio-blu da terminale di borsa */
:root{
  --bg:#eef1f6; --surface:#ffffff; --surface2:#e4e9f1; --fg:#121826; --muted:#586379; --line:#d3dae5;
  --accent:#2443c4; --accent-fg:#ffffff; --accent-soft:#dfe5fb;
  --good:#16804a; --good-bg:#ddf2e5; --warn:#a86a10; --warn-bg:#fbefd6; --bad:#bf3329; --bad-bg:#fae2df;
  --shadow:0 1px 2px rgba(18,24,38,.06),0 4px 14px rgba(18,24,38,.05);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0c1018; --surface:#151b26; --surface2:#1d2533; --fg:#e7ebf2; --muted:#98a3b7; --line:#2a3346;
  --accent:#8aa0ff; --accent-fg:#0c1018; --accent-soft:#1e2748;
  --good:#4fc684; --good-bg:#13301f; --warn:#e8b65c; --warn-bg:#33270f; --bad:#ff7d72; --bad-bg:#3a1916;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0c1018; --surface:#151b26; --surface2:#1d2533; --fg:#e7ebf2; --muted:#98a3b7; --line:#2a3346;
  --accent:#8aa0ff; --accent-fg:#0c1018; --accent-soft:#1e2748;
  --good:#4fc684; --good-bg:#13301f; --warn:#e8b65c; --warn-bg:#33270f; --bad:#ff7d72; --bad-bg:#3a1916;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark; }
:root[data-theme="light"]{ color-scheme:light; }

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h2{font-size:1.25rem;font-weight:800}
h3{font-size:1.02rem;font-weight:600}
p{margin:0}
a{color:var(--accent)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.up{color:var(--good)} .down{color:var(--bad)}
.wrap{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand h1{font-size:1.15rem;font-weight:800;line-height:1.1}
.brand .sub{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.ecg{width:34px;height:22px;flex:none}
.ecg path{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:80;stroke-dashoffset:0}
@media (prefers-reduced-motion:no-preference){.ecg path{animation:beat 2.4s ease-in-out infinite}}
@keyframes beat{0%{stroke-dashoffset:80}45%,100%{stroke-dashoffset:0}}
.icon-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.icon-btn svg{width:20px;height:20px;stroke:var(--fg);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.top-actions{display:flex;gap:8px}

main{padding-block:16px 150px}
.view{display:grid;gap:16px}
.banner{border-radius:var(--r);padding:12px 14px;font-size:.88rem;display:flex;gap:10px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.banner.demo{background:var(--warn-bg);color:var(--fg);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent)}
.banner.err{background:var(--bad-bg);border:1px solid color-mix(in srgb,var(--bad) 35%,transparent);display:block}
.banner.err ul{margin:6px 0;padding-left:18px}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-mono);font-size:.68rem;letter-spacing:.06em;padding:2px 7px;border-radius:999px;background:var(--surface2);color:var(--muted);text-transform:uppercase;white-space:nowrap}
.badge.demo{background:var(--warn-bg);color:var(--warn)}
.badge.live{background:var(--good-bg);color:var(--good)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-weight:600;font-size:.85rem;white-space:nowrap}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.pill.good{background:var(--good-bg);color:var(--good)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.neutral{background:var(--surface2);color:var(--muted)}
.q{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:var(--surface2);color:var(--muted);font-family:var(--f-mono);font-size:.75rem;font-weight:600;cursor:pointer;display:inline-grid;place-items:center;vertical-align:middle;flex:none;padding:0}
.q:hover{color:var(--accent);border-color:var(--accent)}

/* Semaforo */
.sema{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.lights{display:grid;gap:6px;padding:8px;border-radius:14px;background:var(--surface2);border:1px solid var(--line)}
.lights span{width:22px;height:22px;border-radius:50%;background:var(--line);opacity:.5}
.lights .on.r{background:var(--bad);opacity:1;box-shadow:0 0 0 4px var(--bad-bg)}
.lights .on.y{background:var(--warn);opacity:1;box-shadow:0 0 0 4px var(--warn-bg)}
.lights .on.g{background:var(--good);opacity:1;box-shadow:0 0 0 4px var(--good-bg)}
.sema-score{font-family:var(--f-display);font-size:2.4rem;font-weight:800;line-height:1}
.sema-score small{font-size:1rem;color:var(--muted);font-weight:600}
.comp-list{display:grid;gap:10px;margin-top:14px}
.comp{display:grid;gap:4px}
.comp-top{display:flex;align-items:center;gap:8px;justify-content:space-between}
.comp-name{display:flex;align-items:center;gap:6px;font-weight:600;font-size:.9rem}
.bar{height:6px;border-radius:4px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.comp p{font-size:.82rem;color:var(--muted)}

/* Strumenti */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:6px;min-width:0}
.tile-h{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
.tile-name{font-weight:600;font-size:.92rem;line-height:1.2}
.tile-proxy{font-size:.7rem;color:var(--muted);font-family:var(--f-mono)}
.tile-price{font-family:var(--f-mono);font-size:1.15rem;font-weight:500}
.chg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;font-size:.72rem}
.chg span{display:grid;font-family:var(--f-mono)}
.chg b{font-family:var(--f-body);font-weight:500;color:var(--muted);font-size:.66rem;text-transform:uppercase;letter-spacing:.06em}
.spark{width:100%;height:34px;display:block}
.spark .line{fill:none;stroke:var(--good);stroke-width:1.6;vector-effect:non-scaling-stroke}
.spark .area{fill:var(--good-bg);stroke:none}
.spark.down .line{stroke:var(--bad)} .spark.down .area{fill:var(--bad-bg)}
.rbars{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;height:44px;align-items:end}
.rbars span{display:grid;grid-template-rows:1fr auto;height:100%;align-items:end;justify-items:center;gap:2px}
.rbars i{display:block;width:100%;max-width:22px;border-radius:3px 3px 0 0;background:var(--good)}
.rbars i.neg{background:var(--bad)}
.rbars b{font-size:.62rem;font-weight:500;color:var(--muted);font-family:var(--f-mono)}
.ruler{position:relative;height:10px;border-radius:6px;display:flex;overflow:visible;margin-top:6px}
.ruler b{flex:1;height:100%}
.ruler .z1{background:var(--good-bg);border-radius:6px 0 0 6px}.ruler .z2{background:var(--warn-bg)}.ruler .z3{background:var(--bad-bg);border-radius:0 6px 6px 0}
.ruler .r1{flex:30;background:var(--good-bg);border-radius:6px 0 0 6px}.ruler .r2{flex:40;background:var(--surface2)}.ruler .r3{flex:30;background:var(--bad-bg);border-radius:0 6px 6px 0}
.ruler i{position:absolute;top:-4px;width:4px;height:18px;margin-left:-2px;border-radius:2px;background:var(--fg)}
.ruler-h{display:flex;justify-content:space-between;gap:8px;font-size:.75rem;color:var(--muted);font-family:var(--f-mono);align-items:center}
.ruler-h span:nth-child(2){color:var(--fg);font-weight:500}
.live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--good);margin-right:6px;vertical-align:middle}
@media (prefers-reduced-motion:no-preference){.live-dot{animation:pulse 2s ease-in-out infinite}}
@keyframes pulse{50%{opacity:.35}}
.ol-row{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:6px}
.ol-row.mine{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.ol-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sig{margin:0;padding:0;list-style:none;display:grid;gap:3px;font-size:.86rem}
.sig li{padding-left:20px;position:relative}
.sig li::before{position:absolute;left:0;top:0;font-family:var(--f-mono);font-weight:600}
.sig li.p::before{content:"+";color:var(--good)}.sig li.n::before{content:"−";color:var(--bad)}.sig li.z::before{content:"=";color:var(--muted)}
.scen{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.scen .pill{min-width:96px;justify-content:center}
@media (max-width:420px){.scen{grid-template-columns:1fr}.scen .pill{justify-self:start}}
.live-chip{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:600;font-family:var(--f-mono);padding:4px 10px;border-radius:999px;background:var(--good-bg);color:var(--good);align-self:center;white-space:nowrap}
.live-chip.off{background:var(--surface2);color:var(--muted)}.live-chip.off .live-dot{background:var(--muted);animation:none}
.live-chip .live-dot{margin-right:0}
@media (max-width:420px){.brand .sub{display:none}.live-chip{padding:4px 8px}}
@media (prefers-reduced-motion:no-preference){.tick{animation:tick 1.2s ease-out}}
@keyframes tick{0%{background:var(--accent-soft)}100%{background:transparent}}
.spark-na{height:34px;font-size:.7rem;color:var(--muted);display:flex;align-items:center}

/* Liste */
.list{display:grid;gap:0}
.row{display:grid;grid-template-columns:1fr auto;gap:10px;padding:12px 0;border-top:1px solid var(--line);align-items:center}
.row:first-child{border-top:0}
.row-main{min-width:0;display:grid;gap:3px}
.row-title{font-weight:600;overflow-wrap:anywhere}
.row-meta{font-size:.78rem;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.news-item{padding:12px 0;border-top:1px solid var(--line);display:grid;gap:4px}
.news-item:first-child{border-top:0}
.news-item a{color:var(--fg);text-decoration:none;font-weight:600}
.news-item a:hover{text-decoration:underline}
.cal-item{display:grid;grid-template-columns:62px 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.cal-item:first-child{border-top:0}
.cal-date{font-family:var(--f-mono);font-size:.8rem;text-align:center;background:var(--surface2);border-radius:8px;padding:6px 4px;line-height:1.15}
.cal-date b{display:block;font-size:1.1rem;font-weight:500}
.cal-date.today{background:var(--accent);color:var(--accent-fg)}

/* Controlli */
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
label.fld{display:grid;gap:4px;font-size:.78rem;color:var(--muted);font-weight:500}
select,input[type=text],input[type=number],input[type=password]{width:100%;min-width:0;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-size:.95rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);font-weight:600;cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.small{padding:6px 12px;font-size:.85rem}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.star{background:none;border:0;cursor:pointer;padding:6px;font-size:1.2rem;line-height:1;color:var(--muted)}
.star.on{color:var(--warn)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:500;font-size:.88rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.score-num{font-family:var(--f-display);font-weight:800;font-size:1.25rem;min-width:2.4ch;text-align:right}

/* Tabelle */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.86rem}
th,td{text-align:left;padding:8px 6px;border-top:1px solid var(--line);vertical-align:top}
th{font-weight:500;color:var(--muted);font-size:.74rem;text-transform:uppercase;letter-spacing:.05em;border-top:0}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}

/* Navigazione inferiore */
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.disclaimer{font-size:.7rem;color:var(--muted);text-align:center;padding:5px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);max-width:780px;margin:0 auto;padding:0 max(4px,env(safe-area-inset-right,0px)) 0 max(4px,env(safe-area-inset-left,0px))}
.tab{background:none;border:0;padding:8px 2px 10px;display:grid;justify-items:center;gap:2px;font-size:.68rem;font-weight:500;color:var(--muted);cursor:pointer;position:relative}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent)}
.tab .dot{position:absolute;top:6px;right:calc(50% - 16px);width:8px;height:8px;border-radius:50%;background:var(--bad)}

/* Pannelli */
.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:rgba(8,12,20,.45)}
.sheet-panel{background:var(--bg);width:100%;max-width:780px;max-height:92%;overflow-y:auto;border-radius:18px 18px 0 0;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet-head{position:sticky;top:0;background:var(--bg);display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:14px 10px;z-index:2}
.sheet-body{display:grid;gap:14px}
#help{z-index:50}
.help-ex{background:var(--accent-soft);border-radius:10px;padding:12px;font-size:.9rem}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:.88rem}
.kv dt{color:var(--muted);display:flex;align-items:center;gap:6px}
.kv dd{margin:0;font-family:var(--f-mono);text-align:right}
.ring{--v:0;width:76px;height:76px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--v)*1%),var(--surface2) 0);display:grid;place-items:center;flex:none}
.ring b{width:60px;height:60px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--f-display);font-size:1.4rem;font-weight:800}
.summary{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.reason{display:grid;gap:12px}
.reason ul{margin:4px 0 0;padding-left:18px;display:grid;gap:4px}
.reason h3{display:flex;align-items:center;gap:8px}
.chart-box{position:relative;height:220px}
.lesson p+p{margin-top:10px}
.lesson-body{max-width:65ch}
.quiz{display:grid;gap:14px}
.quiz fieldset{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0;display:grid;gap:6px}
.quiz legend{font-weight:600;padding:0 4px}
.quiz label{display:flex;gap:8px;align-items:flex-start;font-size:.92rem;cursor:pointer}
.quiz .fb{font-size:.84rem;border-radius:8px;padding:8px 10px}
.quiz .fb.ok{background:var(--good-bg)} .quiz .fb.ko{background:var(--bad-bg)}
.level{display:grid;gap:10px}
.progress{height:6px;border-radius:4px;background:var(--surface2);overflow:hidden}
.progress i{display:block;height:100%;background:var(--good)}
.lesson-card{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;text-align:left;width:100%}
.lesson-card .check{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.8rem}
.lesson-card.done .check{background:var(--good);border-color:var(--good);color:#fff}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-width:0}
.stat b{display:block;font-family:var(--f-mono);font-size:1.1rem;font-weight:500;overflow-wrap:anywhere}
.stat span{font-size:.75rem;color:var(--muted)}
.alert{background:var(--warn-bg);border-radius:8px;padding:6px 10px;font-size:.8rem;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:6px}
.skeleton{color:var(--muted);font-size:.88rem;padding:8px 0}
details.gl{border-top:1px solid var(--line);padding:10px 0}
details.gl summary{cursor:pointer;font-weight:600}
details.gl p{margin-top:6px;font-size:.9rem}
@media (min-width:600px){ .stats{grid-template-columns:repeat(4,1fr)} }
</style>
</head>
<body>

<header class="top"><div class="wrap">
  <div class="brand">
    <svg class="ecg" viewBox="0 0 34 22" aria-hidden="true"><path d="M1 12h7l3-8 5 15 4-11 3 4h10"/></svg>
    <div><h1>Polso dei Mercati</h1><span class="sub">Coach</span></div>
  </div>

// Limita le chiamate contemporanee per rispettare i limiti dei piani gratuiti
function limiter(max, gapMs) {
  let active = 0; const q = [];
  const next = () => {
    if (active >= max || !q.length) return;
    active++;
    const { fn, res, rej } = q.shift();
    fn().then(res, rej).finally(() => setTimeout(() => { active--; next(); }, gapMs));
  };
  return fn => new Promise((res, rej) => { q.push({ fn, res, rej }); next(); });
}

async function fetchJSON(url) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 12000);
  let res;
  try { res = await fetch(url, { signal: ctrl.signal }); }
  catch (e) { throw new Error(e.name === "AbortError" ? "il server non ha risposto in tempo." : "connessione non riuscita (rete assente o richiesta bloccata dal browser)."); }
  finally { clearTimeout(timer); }
  if (res.status === 429) throw new Error("limite di chiamate raggiunto, riprova tra qualche minuto.");
  if (res.status === 401 || res.status === 403) throw new Error("chiave API non valida o dato non incluso nel piano gratuito.");
  if (!res.ok) throw new Error("errore del server (" + res.status + ").");
  return res.json();
}

  try { const v = await loader(); Store.set(k, { t: Date.now(), v }); return v; }
  catch (e) { if (hit) return hit.v; throw e; }
}

function demoSeries(item) {
  if (demoCache.has(item.sym)) return demoCache.get(item.sym);
  const r = rng(hashStr(item.sym)); const n = 320;
  const vol = 0.007 + r() * 0.012, drift = (r() - 0.42) * 0.0014;
  const dates = []; let x = new Date();
  while (dates.length < n) { const wd = x.getDay(); if (wd !== 0 && wd !== 6) dates.unshift(iso(x)); x = addDays(x, -1); }
  let p = 100; const c = [];
  for (let i = 0; i < n; i++) { const z = (r() + r() + r() - 1.5) * 2; p *= 1 + drift + vol * z; c.push(p); }
  const k = item.base / c[n - 1];
  const out = dates.map((d, i) => ({ date: d, close: +(c[i] * k).toFixed(4) }));
  demoCache.set(item.sym, out);
  return out;
}

  const w = String(text).toLowerCase().match(/[a-zàèéìòù]+/g) || [];
  let s = 0; for (const x of w) { if (POS.has(x)) s++; else if (NEG.has(x)) s--; }
  return s > 0 ? 1 : s < 0 ? -1 : 0;
}
const sentPill = s => s > 0 ? '<span class="pill good">Positivo</span>' : s < 0 ? '<span class="pill bad">Negativo</span>' : '<span class="pill neutral">Neutro</span>';
function newsSentiment(list) {
  const pos = list.filter(n => n.sent > 0).length, neg = list.filter(n => n.sent < 0).length;
  return { count: list.length, pos, neg, avg: list.length ? (pos - neg) / list.length : 0 };
}
function oneLine(s) {
  s = String(s || "").replace(/\s+/g, " ").trim();
  const m = s.match(/^.{20,}?[.!?](\s|$)/); let o = m ? m[0].trim() : s;
  if (o.length > 150) o = o.slice(0, 147).trim() + "…";
  return o;
}
function normNews(n) {
  return { title: n.headline, summary: oneLine(n.summary || n.headline), source: n.source, time: n.datetime * 1000, url: n.url, sent: sentimentOf((n.headline || "") + " " + (n.summary || "")) };
}

// Gestisce un errore del connettore: blocca Bigdata.com se serve un intervento tuo
function bdFail(e) {
  const code = (e && e.code) || "upstream_error";
  if (BD_STOP.has(code)) { BD.on = false; BD.issue = code; renderBdBanner(); updateDemoBanner(); }
  else if (code === "tool_error" && /credit/i.test(String(e.message || ""))) { BD.on = false; BD.issue = "credits"; renderBdBanner(); }
  else if (code === "tool_error") reportError("Bigdata.com ha risposto con un errore: " + String(e.message || "").slice(0, 160));
  else reportError("Bigdata.com non è raggiungibile in questo momento. Riprova tra qualche minuto.");
  return e;
}
// Una chiamata a uno strumento di Bigdata.com, con cache e un solo nuovo tentativo se l'errore lo consente
async function bdCall(tool, input, staleMs = 15 * MIN, refresh = false) {
  if (!BD.on) throw { code: "off" };
  const cache = { staleTime: staleMs, gcTime: Math.max(staleMs, 30 * MIN) };
  if (refresh) cache.refresh = true;
  const run = () => bdQ(() => BD.mcp.callTool(BD_SERVER, tool, input, { cache }));
  let r;
  try { r = await run(); }
  catch (e) {
    if (!(e && e.retryable)) throw bdFail(e);
    await sleep(Math.min(e.retryAfterMs || 1200 + Math.random() * 1500, 8000));
    try { r = await run(); } catch (e2) { throw bdFail(e2); }
  }
  return r && r.payload !== undefined ? r.payload : r;
}

// Legge le tabelle markdown restituite dai "tearsheet" di Bigdata.com
function bdNum(s) {
  if (s == null) return null;
  const t = String(s).replace(/[,%+\s]/g, "").replace("−", "-");
  if (!t || t === "–" || t === "-") return null;
  const v = parseFloat(t); return isFinite(v) ? v : null;
}
function mdTables(md) {
  const L = String(md || "").split("\n"); const out = []; let h2 = "", h3 = "";
  const cells = l => l.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
  for (let i = 0; i < L.length; i++) {
    const l = L[i];
    if (l.startsWith("## ")) { h2 = l.slice(3).trim(); h3 = ""; continue; }
    if (l.startsWith("### ")) { h3 = l.slice(4).trim(); continue; }
    if (l.trim().startsWith("|") && L[i + 1] && /^\s*\|[\s\-:|]+\|\s*$/.test(L[i + 1])) {
      const hdr = cells(l); const rows = []; i += 2;
      while (i < L.length && L[i].trim().startsWith("|")) { const c = cells(L[i]); const o = {}; hdr.forEach((h, j) => { o[h] = c[j]; }); rows.push(o); i++; }
      i--; out.push({ h2, h3, rows });
    }
  }
  return out;
}
function findRow(tables, col, val) { for (const t of tables) { const r = t.rows.find(x => x[col] === val); if (r) return r; } return null; }

// Notizie: ricerca nelle news delle ultime N ore (finestra arrotondata a 15 minuti per sfruttare la cache)
async function bdNews(queries, extraFilters, hours) {
  const end = new Date(Math.floor(Date.now() / (15 * MIN)) * 15 * MIN);
  const start = new Date(end.getTime() - hours * HOUR);
  const ts = d => d.toISOString().slice(0, 19) + "Z";
  const res = await Promise.all(queries.map(q => bdCall("bigdata_search", { request: { search_mode: "fast", query: {
    text: q, max_chunks: 15,
    filters: Object.assign({ category: { mode: "INCLUDE", values: ["news"] }, timestamp: { start: ts(start), end: ts(end) } }, extraFilters || {})
  } } }, HOUR).catch(() => null)));
  const seen = new Set(), out = [];
  res.forEach(p => ((p && p.results) || []).forEach(d => {
    if (!d || seen.has(d.id)) return; seen.add(d.id);
    const txt = (d.chunks || []).map(c => c.text).join(" ").replace(/[#|*\\]/g, " ");
    const t = String(d.timestamp || "");
    out.push({ id: d.id, title: d.headline, summary: oneLine(txt), source: d.source && d.source.name, time: Date.parse(t + (/Z|[+-]\d\d:?\d\d$/.test(t) ? "" : "Z")), url: d.url, sent: sentimentOf(d.headline + " " + txt) });
  }));
  return out.sort((a, b) => b.time - a.time);
}

function bdCompanyParse(stock, j) {

// Estrae da una frase del tipo "shares slid 11% to USD287.63 after hours" la variazione e il prezzo
function extractAH(sentence) {
  if (!/(after[- ]hours|extended(?:-hours)? trading|pre-?market)/i.test(sentence)) return null;
  const m = sentence.match(/(\d+(?:\.\d+)?)\s?%/); if (!m) return null;
  const negI = sentence.search(/\b(fell|falls?|down|slid|slides?|dropp?(?:ed|s)?|declin\w*|sank|sinks?|tumbl\w*|plung\w*|lower|lost|sheds?)\b/i);

  const sign = posI < 0 || (negI >= 0 && negI < posI) ? -1 : 1;
  const pr = sentence.match(/\b(?:to|at)\s(?:USD\s?|US\$|\$)(\d[\d,]*(?:\.\d+)?)/);

async function bdAfterHoursNews() {
  const us = UNIVERSE.filter(s => s.market === "US" || s.live);

/* =========================================================

  if (!ZK.on) throw { code: "off" };

  let r;
  try { r = await zkQ(() => BD.mcp.callTool(ZK_SERVER, tool, input, { cache })); }
  catch (e) {
    const code = e && e.code;

    else throw e;
  }
  const p = r && r.payload !== undefined ? r.payload : r;

function zkCompareParse(md) {
  const out = {};
  mdTables(md).forEach(t => {
    if (!t.rows.length || !("field" in t.rows[0])) return;
    const cols = Object.keys(t.rows[0]).filter(k => k !== "field");
    t.rows.forEach(r => cols.forEach(c => { (out[c] = out[c] || {})[r.field] = r[c]; }));
  });

}
// Ultimo valore trimestrale disponibile di una voce del "Financial Overview" (es. debito/patrimonio)
function fovLatest(o, key) {

  return ks.length ? bdNum(o[ks[0]]) : null;
}
async function zkAll() {

  if (ZK.loading) return ZK.loading;
  ZK.loading = (async () => {
    const live = UNIVERSE.filter(s => s.live).map(s => s.sym);
    const batches = [];
    for (let i = 0; i < live.length; i += 5) batches.push(live.slice(i, i + 5));
    if (batches.length > 1 && batches[batches.length - 1].length === 1) batches[batches.length - 1].push(batches[0][0]);
    const saved = Store.get("zk_map", null);
    const map = Object.assign({}, (saved && saved.v) || {}, ZK.map || {});
    const res = await Promise.all(batches.map(b => zkCall("compare_stocks", { tickers: b, section: "FOV" }, 6 * HOUR).then(zkCompareParse).catch(() => null)));
    let fresh = false;
    res.forEach(r => { if (r) { fresh = true; Object.assign(map, r); } });
    if (!Object.keys(map).length) throw new Error("Zacks non ha risposto.");
    ZK.map = map; ZK.t = Date.now();
    if (fresh) Store.set("zk_map", { t: ZK.t, v: map });

// Se l'ampiezza manca, il totale viene riportato su 100 con le sole componenti disponibili.
// trend = {price, ma50, ma200}; vol = {v, kind: "vix" | "real"}; breadth = {n, up} oppure null
// Semaforo: trend (35) + volatilità (25) + ampiezza (20) + sentiment notizie (20) = 100.
// Le componenti mancanti vengono escluse e il totale è riportato su 100.
function semaforo(trend, vol, breadth, sent) {
  const comps = []; let p, why;
  if (!trend || !isNum(trend.price) || !isNum(trend.ma50)) { p = 17; why = "Medie mobili non disponibili: assegno metà punteggio."; }

    else { p = (price > ma50 ? 20 : 0) + 7; why = `S&P 500 ${price > ma50 ? "sopra" : "sotto"} la media a 50 giorni. La media a 200 giorni non è disponibile: +7 neutri.`; }
  }

  else { const g = avg(gs); p = g >= 15 ? 25 : g >= 7 ? 18 : g >= 0 ? 10 : 3; why = `Crescita annua: ricavi ${pct(m.revG, 1)}, utili ${pct(m.epsG, 1)} (media ${pct(g, 1)}).`; }
  comps.push({ key: "cre", name: "Crescita", help: "crescita", p, max: 25, why });

  if (stock.sector === "Finanza") { p = 15; why = "Per banche e assicurazioni il debito è la materia prima del business: il rapporto debito/patrimonio non si confronta come per le altre aziende, punteggio neutro."; }
  else if (!isNum(m.de)) { p = 12; why = "Debito non disponibile: punteggio neutro."; }
  else { p = m.de <= 0.3 ? 25 : m.de <= 0.8 ? 18 : m.de <= 1.5 ? 10 : 4; why = `Debito/patrimonio ${nf(m.de, 2)} contro ${nf(a.de, 2)} medio del settore.`; }
  comps.push({ key: "sol", name: "Solidità", help: "de", p, max: 25, why });

  if (!isNum(m.pe) || m.pe <= 0) { p = 5; why = "P/E non significativo (utili negativi o dato assente)."; }
  else { const r = m.pe / a.pe; p = r <= 0.8 ? 25 : r <= 1.1 ? 17 : r <= 1.5 ? 9 : 3; why = `P/E ${nf(m.pe, 1)} contro ${nf(a.pe, 1)} del settore (${r < 1 ? "più basso" : "più alto"} del ${nf(Math.abs(r - 1) * 100, 0)}%).`; }
  comps.push({ key: "val", name: "Valutazione", help: "pe", p, max: 25, why });

  const w = PROFILES[S.profile].w; let num = 0, den = 0;
  comps.forEach(c => { c.w = w[c.key]; num += c.p * c.w; den += c.max * c.w; });
  return { score: Math.round(num / den * 100), comps };
}
const qBand = s => s >= 70 ? "Alta" : s >= 50 ? "Media" : "Bassa";
const qClass = s => s >= 70 ? "good" : s >= 50 ? "warn" : "bad";

// Momento di ingresso: somma pesata di segnali da -2 a +2
function entryMoment(stock, m, t, price) {
  const h = HORIZONS[S.horizon]; const a = SECTOR[stock.sector]; const comps = []; let v, why;
  if (isNum(m.pe) && m.pe > 0) { const r = m.pe / a.pe; v = r <= 0.85 ? 2 : r <= 1.15 ? 0 : r <= 1.5 ? -1 : -2; why = `P/E ${nf(m.pe, 1)} contro ${nf(a.pe, 1)} del settore.`; }
  else { v = 0; why = "P/E non significativo: nessun contributo."; }
  comps.push({ name: "Valutazione relativa", help: "pe", raw: v, w: h.fund, why });

  if (t && isNum(t.rsi)) { const r = t.rsi; v = r < 30 ? 2 : r < 40 ? 1 : r <= 65 ? 0 : r <= 75 ? -1 : -2; why = `RSI ${nf(r, 0)}: ${r < 30 ? "ipervenduto, il prezzo è sceso molto in fretta" : r > 70 ? "ipercomprato, il prezzo è salito molto in fretta" : "zona neutra"}.`; }
  else { v = 0; why = "RSI non disponibile: serve lo storico dei prezzi giornalieri. Nessun contributo."; }
  comps.push({ name: "RSI a 14 giorni", help: "rsi", raw: v, w: h.tech, why });

  const px = t && isNum(t.price) ? t.price : price; // prezzo nella stessa valuta dello storico
  if (t && isNum(t.ma50)) { const d = (px / t.ma50 - 1) * 100; v = d > 10 ? -1 : d < -10 ? 1 : 0; why = `Prezzo ${pct(d, 1)} rispetto alla media a 50 giorni${d > 10 ? ": movimento esteso" : d < -10 ? ": forte sconto sulla media recente" : ""}.`; }
  else { v = 0; why = "Media mobile non calcolabile."; }
  comps.push({ name: "Distanza dalla media a 50 giorni", help: "ma", raw: v, w: h.tech, why });

  const hi = t && isNum(t.hi52) ? t.hi52 : isNum(m.hi52) ? m.hi52 : t ? t.hi : null;
  if (isNum(hi)) { const d = (px / hi - 1) * 100; v = d < -25 ? 1 : d > -5 ? -1 : 0; why = `Prezzo ${pct(d, 1)} rispetto al massimo delle ultime 52 settimane.`; }
  else { v = 0; why = "Massimo annuale non disponibile."; }
  comps.push({ name: "Distanza dal massimo annuale", help: "supporti", raw: v, w: 1, why });

  if (t) { v = t.trend === "Ribassista" ? -1 : 0; why = t.trend === "Ribassista" ? "Trend ribassista: un prezzo basso può scendere ancora." : `Trend ${t.trend.toLowerCase()}: nessuna penalità.`; }
  else { v = 0; why = "Trend non calcolabile."; }
  comps.push({ name: "Trend", help: "trend", raw: v, w: h.tech, why });

  const total = comps.reduce((s, c) => s + c.raw * c.w, 0);
  return { label: total >= 1.5 ? "Interessante" : total <= -1.5 ? "Caro" : "Nella media", total, comps };
}
const momentClass = l => l === "Interessante" ? "good" : l === "Caro" ? "bad" : "warn";

function risks(stock, m, t, sent, pd) {
  const r = []; const a = SECTOR[stock.sector];
  if (isNum(m.de) && stock.sector !== "Finanza" && m.de > 1.5) r.push(`Debito elevato: debito/patrimonio ${nf(m.de, 2)} contro ${nf(a.de, 2)} del settore. Con tassi alti pesa sugli utili.`);
  if (isNum(m.epsG) && m.epsG < 0) r.push(`Utili in calo del ${nf(-m.epsG, 1)}% nell'ultimo anno.`);
  if (isNum(m.margin) && m.margin <= 0) r.push("Azienda in perdita: il valore dipende da utili futuri incerti.");
  if (isNum(m.pe) && m.pe > a.pe * 1.5) r.push(`Valutazione alta: P/E ${nf(m.pe, 1)}, oltre il 50% sopra la media di settore. Una delusione sugli utili può pesare molto sul prezzo.`);
  if (t && isNum(t.vol) && t.vol > 35) r.push(`Volatilità elevata (${nf(t.vol, 0)}% annuo): oscillazioni ampie anche in poche settimane.`);
  if (t && isNum(t.rsi) && t.rsi > 70) r.push("Salita recente molto rapida (RSI sopra 70): possibili prese di beneficio.");
  if (t && t.trend === "Ribassista") r.push("Trend ribassista: il mercato sta ancora vendendo il titolo.");
  if (sent && sent.count >= 3 && sent.avg < -0.2) r.push("Notizie della settimana prevalentemente negative.");
  if (isNum(m.beta) && m.beta > 1.4) r.push(`Beta ${nf(m.beta, 2)}: tende ad amplificare i movimenti del mercato.`);
  const ccy = pd.ccy || stock.ccy;
  if (ccy === "USD") r.push("Quotato in dollari: per chi investe in euro il cambio EUR/USD aggiunge un rischio.");
  else if (ccy && ccy !== "EUR") r.push(`Quotato in ${ccy}: per chi investe in euro il cambio aggiunge un rischio.`);
  if (pd.source === "demo") r.push("Dati dimostrativi: non usarli per decisioni reali.");
  if (!r.length) r.push("Nessun rischio specifico evidente nei dati disponibili. Restano i rischi di mercato e di settore.");
  return r;
}

async function stockBundle(stock) {
  // 0) Zacks per i titoli quotati negli USA, con storico Alpha Vantage in dollari
  if (ZK.on && stock.live) {
    try {
      const map = await zkAll(); const o = map && map[stock.sym];
      if (o) {
        const z = zkParse(stock, o);
        // Prezzo quasi in tempo reale da Bigdata.com, se già scaricato per i movimenti e nella stessa valuta
        const mv = moverFor(stock.sym), lq = LIVE[stock.sym];
        if (lq && Date.now() - lq.fetched < 30 * MIN) { z.pd.price = lq.price; z.pd.dayPct = lq.d1; z.pd.asOf = new Date(lq.at).toISOString(); z.pd.eod = false; z.pd.source = "twelve"; }
        else if (mv && MOVERS.src === "bigdata" && mv.ccy === "USD" && isNum(mv.price)) { z.pd.price = mv.price; z.pd.dayPct = mv.d1; z.pd.asOf = mv.asOf; z.pd.eod = false; }
        const [nn, av] = await Promise.all([getCompanyNews(stock), AV.on ? avSeries(stock, true).catch(e => ({ error: e })) : Promise.resolve(null)]);
        let t = null;
        if (av && av.series) t = avMerge(z.pd, z.m, null, av);
        else if (av && av.error) z.pd.avError = av.error instanceof Error ? av.error.message : (AV.issue ? AV_FIX[AV.issue] : "storico non disponibile in questo momento.");
        const b = finishBundle(stock, z.pd, z.m, "zacks", t, nn);
        b.an = z.an; b.er = z.er;
        return b;
      }
    } catch (e) { if (e instanceof Error) reportError("Zacks (" + stock.name + "): " + e.message); }
  }
  // 1) Bigdata.com, se disponibile
  if (BD.on && stock.id) {
    try {
      const [j, nn, av] = await Promise.all([bdCompany(stock), getCompanyNews(stock), AV.on ? avSeries(stock).catch(e => ({ error: e })) : Promise.resolve(null)]);
      const parsed = bdCompanyParse(stock, j);
      const { pd, m } = parsed; let t = parsed.t;
      if (av && av.series) t = avMerge(pd, m, t, av);
      else if (av && av.error) pd.avError = av.error instanceof Error ? av.error.message : (AV.issue ? AV_FIX[AV.issue] : "storico non disponibile in questo momento.");
      if (isNum(pd.price)) return finishBundle(stock, pd, m, "bigdata", t, nn);
    } catch (e) { if (e instanceof Error) reportError("Bigdata.com (" + stock.name + "): " + e.message); }
  }
  // 2) Chiavi API o dati demo
  const [pd, mm, nn] = await Promise.all([getPriceData(stock, true), getMetrics(stock), getCompanyNews(stock)]);
  const t = technicals(pd); const m = Object.assign({}, mm.data);
  if (t && (pd.source === "demo" || !isNum(m.hi52))) { m.hi52 = t.hi; m.lo52 = t.lo; }
  return finishBundle(stock, pd, m, mm.source, t, nn);
}
function finishBundle(stock, pd, m, msrc, t, nn) {
  const sent = newsSentiment(nn.data);
  const q = qualityScore(stock, m), mo = entryMoment(stock, m, t, pd.price);
  const b = { stock, pd, m, msrc, news: nn, t, sent, q, mo, risks: risks(stock, m, t, sent, pd) };
  trackEval(stock.sym, q.score, mo.label);
  return b;
}

let watch = Store.get("watch", ["E", "ASML", "KO"]);
let evals = Store.get("evals", {});
let alerts = Store.get("alerts", {});
const inWatch = s => watch.includes(s);
// Salvataggio della watchlist: sul tuo account (spazio dati privato dell'app, uguale su ogni dispositivo)
// con una copia nel browser come riserva. Solo tu puoi leggerla e modificarla.
const WS = { ref: null, state: "locale", timer: null, chain: Promise.resolve() };
function watchSaveNote() {
  return WS.state === "account" ? "salvata sul tuo account" : WS.state === "errore" ? "salvata solo su questo dispositivo" : "salvata su questo dispositivo";
}
async function initWatchSync() {
  if (!window.claude || typeof window.claude.use !== "function") return;
  try {
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    const uid = user ? await user.id() : null;
    if (!db || !uid) return;
    WS.ref = db.doc("data/users/" + uid + "/watchlist");
    const snap = await WS.ref.get();
    const remote = snap.exists ? (snap.data() || {}).syms : null;
    if (Array.isArray(remote)) { WS.state = "account"; applyRemoteWatch(remote); }
    else await writeWatchNow(); // primo avvio: porta sull'account la watchlist di questo dispositivo
    // Se la modifichi da un altro dispositivo, si aggiorna anche qui
    WS.ref.onSnapshot(sn => { if (sn.exists && !sn.metadata.hasPendingWrites) applyRemoteWatch((sn.data() || {}).syms || []); }, () => {});
  } catch (e) { WS.state = "errore"; }
}
function applyRemoteWatch(syms) {
  const clean = (syms || []).filter(x => typeof x === "string" && bySym(x));
  if (JSON.stringify(clean) === JSON.stringify(watch)) return;
  watch = clean; Store.set("watch", watch);
  refreshStars(); updateWatchDot();
  if (current === "watchlist") renderWatchlist();
  if (current === "mercato") renderMovers();
}
function writeWatchNow() {
  if (!WS.ref) return Promise.resolve();
  const data = { syms: watch.slice(), updated: Date.now() };
  WS.chain = WS.chain.then(() => WS.ref.set(data)).then(() => { WS.state = "account"; })
    .catch(e => { WS.state = "errore"; reportError("La watchlist non è stata salvata sul tuo account (" + ((e && e.code) || "errore") + "): per ora resta salvata su questo dispositivo."); });
  return WS.chain;
}
// Più stelline toccate di fila diventano un solo salvataggio
function saveWatch() {
  Store.set("watch", watch);
  clearTimeout(WS.timer);
  WS.timer = setTimeout(writeWatchNow, 600);
}
function refreshStars() {
  document.querySelectorAll('[data-act="toggle-watch"]').forEach(b => {
    const on = inWatch(b.dataset.sym);
    b.classList.toggle("on", on); b.textContent = on ? "★" : "☆";
    b.setAttribute("aria-label", on ? "Togli dalla watchlist" : "Aggiungi alla watchlist");
  });
}
function toggleWatch(sym) {
  watch = inWatch(sym) ? watch.filter(x => x !== sym) : [...watch, sym];
  saveWatch(); refreshStars(); updateWatchDot();
}
const starBtn = sym => `<button class="star ${inWatch(sym) ? "on" : ""}" data-act="toggle-watch" data-sym="${esc(sym)}" aria-label="${inWatch(sym) ? "Togli dalla watchlist" : "Aggiungi alla watchlist"}">${inWatch(sym) ? "★" : "☆"}</button>`;
// Confronta la nuova valutazione con quella salvata e genera un avviso se cambia
function trackEval(sym, score, label) {
  if (!inWatch(sym)) return;
  const prev = evals[sym]; const band = qBand(score);
  if (prev && (prev.label !== label || prev.band !== band)) {
    const parts = [];
    if (prev.label !== label) parts.push(`ingresso ${prev.label} → ${label}`);
    if (prev.band !== band) parts.push(`qualità ${prev.band} → ${band}`);
    alerts[sym] = { text: parts.join(", "), t: Date.now() };
    Store.set("alerts", alerts);
  }
  evals[sym] = { score, label, band, t: Date.now() };
  Store.set("evals", evals);
  updateWatchDot();
}
function updateWatchDot() { $("#watch-dot").hidden = !(Object.keys(alerts).some(s => inWatch(s)) || (typeof MOVERS !== "undefined" && MOVERS.list.some(r => inWatch(r.s.sym) && bigMove(r)))); }

const VIEWS = ["mercato", "azioni", "watchlist", "accademia", "simulatore"];
let current = null;
const rendered = {};
function showView(v) {
  if (!VIEWS.includes(v)) v = "mercato";
  current = v;
  VIEWS.forEach(x => { $("#view-" + x).hidden = x !== v; });
  document.querySelectorAll(".tab").forEach(t => { if (t.dataset.view === v) t.setAttribute("aria-current", "page"); else t.removeAttribute("aria-current"); });
  if (!rendered[v]) { rendered[v] = true; RENDER[v](); }
  else if (v === "watchlist" || v === "simulatore") RENDER[v]();
  window.scrollTo(0, 0);
}
function go(v) { if (location.hash !== "#" + v) location.hash = v; else showView(v); }

let charts = {};
function destroyChart(k) { if (charts[k]) { charts[k].destroy(); delete charts[k]; } }
function openSheet(title, html) { $("#sheet-title").textContent = title; $("#sheet-body").innerHTML = html; $("#sheet").hidden = false; $(".sheet-panel", $("#sheet")).scrollTop = 0; document.body.style.overflow = "hidden"; }
function closeSheet() { $("#sheet").hidden = true; destroyChart("stock"); clearInterval(stockTimer); TD.focus = null; document.body.style.overflow = ""; }
function openHelp(k) {
  const g = GL[k]; if (!g) return;
  $("#help-title").textContent = g[0];
  $("#help-body").innerHTML = `<p>${esc(g[1])}</p><div class="help-ex"><strong>Esempio pratico.</strong> ${esc(g[2])}</div>`;
  $("#help").hidden = false;
}

function sparkline(series, n = 60) {
  if (!series) return '<div class="spark-na">Grafico non disponibile</div>';
  const c = closesOf(series).slice(-n); const min = Math.min(...c), max = Math.max(...c);
  const W = 120, H = 34;
  const pts = c.map((v, i) => (i / (c.length - 1) * W).toFixed(1) + "," + (H - 2 - (v - min) / ((max - min) || 1) * (H - 4)).toFixed(1)).join(" ");
  return `<svg class="spark ${c[c.length - 1] >= c[0] ? "" : "down"}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><polygon class="area" points="0,${H} ${pts} ${W},${H}"/><polyline class="line" points="${pts}"/></svg>`;
}
function tileHTML(pd) {
  const it = pd.item; const s = pd.series;
  return `<div class="tile">
    <div class="tile-h"><div><div class="tile-name">${esc(it.name)}</div><div class="tile-proxy">${esc(it.proxy)}</div></div>${srcBadge(pd.source)}</div>
    <div class="tile-price">${nf(pd.price)}</div>
    <div class="chg"><span><b>Giorno</b><em class="${cls(pd.dayPct)}" style="font-style:normal">${pct(pd.dayPct)}</em></span><span><b>Sett.</b><em class="${cls(changeOver(s, 5))}" style="font-style:normal">${pct(changeOver(s, 5))}</em></span><span><b>Da gen.</b><em class="${cls(ytd(s))}" style="font-style:normal">${pct(ytd(s))}</em></span></div>
    ${sparkline(s)}
  </div>`;
}
function macroTile(name, value, sub, source, helpKey) {
  return `<div class="tile"><div class="tile-h"><div class="tile-name">${esc(name)} ${help(helpKey)}</div>${source === "manuale" ? '<span class="badge">Manuale</span>' : srcBadge(source)}</div><div class="tile-price">${value}</div><div class="tile-proxy">${esc(sub)}</div></div>`;
}

      <div style="display:grid;gap:6px">
        <span class="pill ${lv[1]}" style="justify-self:start">${lv[0]}</span>

function macroCalendar(days) {
  const now = new Date(); const end = addDays(now, days); const ev = [];
  ECB.forEach(d => ev.push({ date: d, title: "BCE: decisione sui tassi", kind: "Banca centrale" }));
  FED.forEach(d => ev.push({ date: d, title: "Fed: decisione sui tassi", kind: "Banca centrale" }));
  for (let m = 0; m < 3; m++) {
    const y = now.getFullYear(), mo = now.getMonth() + m;
    const first = new Date(y, mo, 1); const fri = new Date(y, mo, 1 + ((5 - first.getDay() + 7) % 7));
    ev.push({ date: iso(fri), title: "USA: rapporto sull'occupazione", kind: "Dato macro", note: "data indicativa" });
    let cpi = new Date(y, mo, 12); while (cpi.getDay() === 0 || cpi.getDay() === 6) cpi = addDays(cpi, 1);
    ev.push({ date: iso(cpi), title: "USA: inflazione (CPI)", kind: "Dato macro", note: "data indicativa" });
    let hicp = new Date(y, mo + 1, 0); while (hicp.getDay() === 0 || hicp.getDay() === 6) hicp = addDays(hicp, -1);
    ev.push({ date: iso(hicp), title: "Eurozona: inflazione flash", kind: "Dato macro", note: "data indicativa" });
  }
  const t0 = iso(now), t1 = iso(end);
  return ev.filter(e => e.date >= t0 && e.date <= t1);
}
function calendarHTML(list) {

      <div class="row-main"><span class="row-title">${esc(e.title)}</span><span class="row-meta">${esc(e.kind)}${e.note ? " · " + esc(e.note) : ""}${e.demo ? ' · <span class="badge demo">Demo</span>' : ""}${e.date === today ? " · oggi" : ""}</span></div></div>`;

}

// Barrette dei rendimenti a 1 mese, 3 mesi, 6 mesi, 1 anno (dati Bigdata.com)
function returnBars(t) {
  const P = [["1M", t.m1], ["3M", t.m3], ["6M", t.m6], ["1A", t.y1]];
  const max = Math.max(5, ...P.map(p => Math.abs(p[1] || 0)));
  return `<div class="rbars" role="img" aria-label="Rendimenti: ${P.map(([l, v]) => l + " " + pct(v, 1)).join(", ")}">${P.map(([l, v]) =>
    `<span title="${l}: ${pct(v, 1)}"><i class="${isNum(v) && v < 0 ? "neg" : "pos"}" style="height:${isNum(v) ? Math.max(3, Math.abs(v) / max * 100) : 0}%"></i><b>${l}</b></span>`).join("")}</div>`;
}

let SPX_IS_INDEX = false;
const SPY_ITEM = { sym: "SPY", name: "S&P 500", market: "US", live: true, base: 585 };
async function spxData() {
  const out = { tile: null, trend: null, vol: null, breadth: null, src: "" };
  if (BD.on) {
    try {
      const [mk, spy] = await Promise.all([bdMarket(), bdSpy().catch(() => null)]);
      const t = mk.tiles.find(x => x.name === "S&P 500");
      if (t) {
        out.tile = Object.assign({ src: "bigdata" }, t); SPX_IS_INDEX = true;
        out.trend = spy && { price: spy.price, ma50: spy.ma50, ma200: spy.ma200 };
        out.vol = isNum(mk.vix) ? { v: mk.vix, kind: "vix" } : spy && isNum(spy.vol20) ? { v: spy.vol20, kind: "real" } : null;
        out.breadth = mk.breadth && mk.breadth.n ? mk.breadth : null;
        out.vix = mk.vix; out.mk = mk; out.src = "Bigdata.com" + (mk.asOf ? " · " + mk.asOf : "");
        return out;
      }
    } catch (e) {}
  }
  let series = null, src = "";
  if (AV.on) { try { series = (await avSeries(SPY_ITEM, true)).series; src = "Alpha Vantage (ETF SPY)"; } catch (e) {} }
  if (!series) { const h = await getHistory(SPY_ITEM); series = h.data; src = h.source === "live" ? "chiave API (ETF SPY)" : "dati demo"; }
  SPX_IS_INDEX = false;
  const c = closesOf(series), n = c.length;
  const lq = LIVE.SPY, price = lq && Date.now() - lq.fetched < HOUR ? lq.price : c[n - 1];
  const yi = series.findIndex(o => o.date.startsWith(String(new Date().getFullYear())));
  out.tile = { name: "S&P 500", sub: "ETF SPY", price, d1: lq && Date.now() - lq.fetched < HOUR ? lq.d1 : (c[n - 1] / c[n - 2] - 1) * 100, d5: changeOver(series, 5), ytd: yi > 0 ? (price / c[yi - 1] - 1) * 100 : null,
    m1: changeOver(series, 21), m3: changeOver(series, 63), m6: changeOver(series, 126), y1: changeOver(series, 252), src: src.startsWith("dati") ? "demo" : "live", series };
  out.trend = { price, ma50: sma(c, 50), ma200: sma(c, 200) };
  out.vol = { v: realizedVol(c), kind: "real" };
  out.src = src;
  return out;
}

// Calendario: trimestrali dei titoli seguiti (Zacks), riunioni Fed/BCE e principali dati USA ed europei
async function stockCalendar() {
  const ev = macroCalendar(30);
  const lim = iso(addDays(new Date(), 30)), today = iso(new Date());
  const map = ZK.on ? await zkAll().catch(() => null) : null;
  if (map) UNIVERSE.filter(s => s.live && map[s.sym]).forEach(s => {
    const z = zkParse(s, map[s.sym]); const d = z.er.next ? String(z.er.next).slice(0, 10) : null;
    if (d && d >= today && d <= lim) ev.push({ date: d, title: "Trimestrale " + s.name + (inWatch(s.sym) ? " ★" : ""), kind: "Trimestrale", note: z.er.nextTime === "AMC" ? "dopo la chiusura USA" : z.er.nextTime === "BTO" ? "prima dell'apertura USA" : "" });
  });
  else { const er = await getEarnings(); er.data.filter(e => e.date >= today && e.date <= lim).forEach(e => ev.push(e)); }
  return ev;
}

async function getBreadth() {
  const qs = await Promise.all(SECTOR_ETF.map(getQuote));
  if (qs.every(q => q && isNum(q.dayPct))) return { n: qs.length, up: qs.filter(q => q.dayPct > 0).length, source: "live" };
  const day = SECTOR_ETF.map(it => { const s = demoSeries(it), n = s.length; return s[n - 1].close / s[n - 2].close - 1; });
  return { n: day.length, up: day.filter(x => x > 0).length, source: "demo" };
}
// Tessere del cruscotto: indici, cambi, materie prime, VIX e rendimenti
async function dashTiles(sp) {
  const out = [];
  if (sp.mk && sp.mk.tiles.length) out.push(...sp.mk.tiles.filter(t => t.name !== "S&P 500").map(bdTileHTML));
  else {
    const pds = await Promise.all(INSTR.filter(it => it.sym !== "SPY").map(it => getPriceData(it)));
    out.push(...pds.map(tileHTML));
  }
  if (isNum(sp.vix)) out.push(macroTile("VIX", nf(sp.vix, 1), "volatilità attesa a 30 giorni", "bigdata", "vix"));
  else if (sp.vol && isNum(sp.vol.v)) out.push(macroTile("Volatilità S&P 500", nf(sp.vol.v, 1) + "%", "realizzata a 20 giorni, al posto del VIX", sp.tile && sp.tile.src === "demo" ? "demo" : "live", "volsost"));
  const btp = parseFloat(S.btp);
  out.push(macroTile("BTP 10 anni", isNum(btp) ? nf(btp) + "%" : "n.d.", isNum(btp) ? "inserito da te nelle Impostazioni" : "inseriscilo nelle Impostazioni", isNum(btp) ? "manuale" : "demo", "btp"));
  const ust = isNum(sp.mk && sp.mk.ust) ? { value: sp.mk.ust, source: "bigdata" } : await getTreasury();
  out.push(macroTile("Treasury USA 10 anni", nf(ust.value) + "%", "rendimento", ust.source, "treasury"));
  if (isNum(btp) && isNum(ust.value) && ust.source !== "demo") out.push(macroTile("Differenza BTP − Treasury", nf((btp - ust.value) * 100, 0) + " pb", "punti base", "manuale", "btp"));
  return out.join("");
}

function explainHTML(b) {
  const { stock: s, q, mo, m, t } = b; const a = SECTOR[s.sector];
  const band = qBand(q.score).toLowerCase();
  const pro = [], contro = [];
  q.comps.forEach(c => { if (c.p >= 18) pro.push(`${c.name}: ${c.why}`); else if (c.p <= 5) contro.push(`${c.name}: ${c.why}`); });
  mo.comps.forEach(c => { if (c.raw > 0) pro.push(`${c.name}: ${c.why}`); else if (c.raw < 0) contro.push(`${c.name}: ${c.why}`); });
  if (b.sent.count >= 3 && b.sent.avg > 0.2) pro.push("Notizie della settimana prevalentemente positive.");
  b.risks.forEach(r => contro.push(r));
  if (!pro.length) pro.push("Nessun dato spicca in modo netto a favore.");
  const hiQ = q.score >= 70, loQ = q.score < 50;
  let thesis = "Quadro misto: vale la pena approfondire i punti qui sotto prima di farsi un'idea.";
  if (hiQ && mo.label === "Interessante") thesis = "Caso da approfondire: i dati descrivono una buona azienda a un prezzo ragionevole rispetto al settore e al suo andamento recente.";
  else if (hiQ && mo.label === "Caro") thesis = "Buona azienda, ma il prezzo sconta già molto. Chi è interessato spesso aspetta o entra a piccole rate.";
  else if (loQ && mo.label === "Interessante") thesis = "Il prezzo sembra basso ma la qualità è debole: attenzione alla trappola del valore.";
  else if (loQ && mo.label === "Caro") thesis = "In questo momento né la qualità né il prezzo giocano a favore.";
  else if (hiQ) thesis = "Azienda solida a un prezzo nella media: il momento non è decisivo, conta di più l'orizzonte.";
  const change = changeSignals(b, 5);
  const prof = PROFILES[S.profile], hor = S.horizon;
  const profText = `Con profilo ${prof.label.toLowerCase()} una regola diffusa è non superare il ${prof.maxPos} del portafoglio su un singolo titolo. ` +
    (hor === "lungo" ? "Con orizzonte lungo il prezzo di ingresso conta meno della qualità dell'azienda: entrare in più rate riduce il rischio di scegliere il momento sbagliato."
      : hor === "breve" ? "Con orizzonte breve le azioni singole sono molto incerte: i segnali tecnici pesano di più, ma considera anche strumenti meno volatili."
        : "Con orizzonte medio qualità e momento pesano allo stesso modo.");
  const li = a => a.map(x => `<li>${esc(x)}</li>`).join("");
  return `<div class="card reason">
    <span class="eyebrow">Ragionamento su ${esc(s.name)}</span>
    <div><h3>1. Tesi</h3><p>I dati indicano una qualità ${band} (${q.score}/100) e un momento di ingresso "${mo.label.toLowerCase()}". ${esc(thesis)}</p></div>

    <div><h3><span class="pill bad">3</span> Dati contro</h3><ul>${li(contro)}</ul></div>
    <div><h3>4. Cosa farebbe cambiare idea</h3><ul>${li(change)}</ul></div>
    <div><h3>5. Il tuo profilo</h3><p>${esc(profText)}</p></div>
    <p class="small muted">Esercizio di ragionamento sui dati, non un invito a comprare o vendere.</p></div>`;

/* =========================================================
   15b. RESOCONTO "IN SINTESI"
   Regole trasparenti, nessuna previsione certa: ogni giudizio elenca i dati su cui si basa.

const fmtDate = d => { if (!d) return "n.d."; const x = new Date(String(d).slice(0, 10) + "T12:00:00"); return isNaN(x) ? "n.d." : x.toLocaleDateString("it-IT", { day: "numeric", month: "long", year: "numeric" }); };
// Segnali concreti che farebbero cambiare il giudizio
function changeSignals(b, max = 3) {
  const { m, t, stock, er } = b; const a = SECTOR[stock.sector]; const out = [];
  const lvl = t && (t.ma200 || t.ma50);
  if (lvl) out.push(`Una chiusura sotto la media a ${t.ma200 ? 200 : 50} giorni (${nf(lvl)}): il trend diventerebbe negativo.`);
  if (er && er.next) out.push(`La prossima trimestrale (${fmtDate(er.next)}): utili sotto le attese${isNum(er.nextEps) ? " di " + nf(er.nextEps) + " $ per azione" : ""} peggiorerebbero il quadro.`);
  else out.push(isNum(m.epsG) && m.epsG < 0 ? "Una ripresa degli utili migliorerebbe la valutazione in modo netto." : "Una trimestrale con utili in calo.");
  if (b.an && isNum(b.an.rev4w)) out.push(`Le stime degli analisti (${pct(b.an.rev4w, 1)} nell'ultimo mese): tagli ripetuti sono spesso un segnale anticipatore.`);
  if (t && isNum(t.support)) out.push(`La rottura del supporto a ${nf(t.support)}: indicherebbe che i compratori si sono ritirati.`);
  if (isNum(m.pe) && m.pe > 0) out.push(`Un P/E sopra ${nf(a.pe * 1.5, 1)} (1,5 volte il settore) senza una crescita degli utili che lo giustifichi.`);
  out.push("Notizie negative ripetute sul business, non solo sul prezzo.");
  return out.slice(0, max);
}
// Prospettiva su tre orizzonti: ogni segnale vale +/−, la somma dà l'orientamento, l'accordo tra segnali la fiducia
function outlook(b) {
  const { m, t, q, an, sent, stock } = b; const A = SECTOR[stock.sector];
  const price = b.pd.price;
  const up = an && isNum(an.target) && isNum(price) && b.pd.ccy === "USD" ? (an.target / price - 1) * 100 : null;
  const add = (arr, v, txt) => arr.push({ v, txt });
  const h6 = [], h1 = [], h5 = [];
  if (t) add(h6, t.trend === "Rialzista" ? 1 : t.trend === "Ribassista" ? -1 : 0, `trend ${t.trend.toLowerCase()} del prezzo`);
  if (t && isNum(t.rsi)) add(h6, t.rsi > 70 ? -0.5 : t.rsi < 30 ? 0.5 : 0, `RSI ${nf(t.rsi, 0)}${t.rsi > 70 ? ": salita molto rapida" : t.rsi < 30 ? ": discesa molto rapida" : ""}`);
  if (an && isNum(an.zr)) add(h6, an.zr <= 2 ? 1 : an.zr >= 4 ? -1 : 0, `Zacks Rank ${an.zr} (${an.zrText || "n.d."}), basato sulle revisioni delle stime`);
  if (an && isNum(an.rev4w)) add(h6, an.rev4w > 1 ? 0.5 : an.rev4w < -1 ? -0.5 : 0, `stime sugli utili dell'anno ${pct(an.rev4w, 1)} in 4 settimane`);
  if (sent && sent.count >= 3) add(h6, sent.avg > 0.2 ? 0.5 : sent.avg < -0.2 ? -0.5 : 0, `notizie recenti ${sent.avg > 0.2 ? "prevalentemente positive" : sent.avg < -0.2 ? "prevalentemente negative" : "miste"}`);
  if (isNum(up)) add(h1, up > 10 ? 1 : up < -5 ? -1 : 0, `prezzo obiettivo medio degli analisti ${nf(an.target)} $ (${pct(up, 1)} dal prezzo attuale)`);
  if (an && isNum(an.abr)) add(h1, an.abr <= 2 ? 0.5 : an.abr >= 3.5 ? -0.5 : 0, `giudizio medio di ${isNum(an.n) ? nf(an.n, 0) + " " : ""}analisti: ${nf(an.abr, 1)} su una scala da 1 (acquisto forte) a 5 (vendita forte)`);
  if (isNum(m.epsG)) add(h1, m.epsG > 5 ? 1 : m.epsG < 0 ? -1 : 0, `crescita degli utili ${pct(m.epsG, 1)}`);
  if (b.er && isNum(b.er.surprise)) add(h1, b.er.surprise > 5 ? 0.5 : b.er.surprise < -5 ? -0.5 : 0, `ultima trimestrale ${b.er.surprise >= 0 ? "sopra" : "sotto"} le attese degli analisti (${pct(b.er.surprise, 1)})`);
  if (isNum(m.pe) && m.pe > 0) add(h1, m.pe < A.pe * 0.85 ? 0.5 : m.pe > A.pe * 1.5 ? -0.5 : 0, `P/E ${nf(m.pe, 1)} contro ${nf(A.pe, 0)} del settore`);
  if (t) add(h1, t.trend === "Ribassista" ? -0.5 : t.trend === "Rialzista" ? 0.5 : 0, `trend ${t.trend.toLowerCase()}`);
  add(h5, q.score >= 70 ? 1.5 : q.score < 50 ? -1 : 0, `punteggio qualità ${q.score}/100`);
